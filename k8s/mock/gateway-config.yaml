apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: llm-platform
data:
  VLLM_BASE_URL: "http://vllm:8000"
  DEFAULT_MODEL: "Qwen/Qwen2.5-0.5B-Instruct"
  RATE_LIMIT_PER_MINUTE: "60"
  UPSTREAM_TIMEOUT_SECONDS: "120"
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secrets
  namespace: llm-platform
type: Opaque
stringData:
  API_KEYS: "sk-demo,sk-team-a"
